# Nginx: proxy inverso de IoT-Mangrove (iotmangrove.info)
# Requiere haber emitido el certificado (ver docs/DESPLIEGUE.md, paso 5).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------- HTTP (80)
server {
    listen 80;
    server_name iotmangrove.info www.iotmangrove.info;

    # Validacion de Let's Encrypt y renovacion automatica
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # El gateway LoRa (ESP32) puede enviar por HTTP simple. Si su firmware
    # usa HTTPS, elimine este bloque para forzar cifrado en todo el trafico.
    location = /api/ingest {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://iotmangrove.info$request_uri;
    }
}

# ---------------------------------------------------------------- HTTPS (443)
server {
    listen 443 ssl;
    http2 on;
    server_name www.iotmangrove.info;

    ssl_certificate     /etc/letsencrypt/live/iotmangrove.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iotmangrove.info/privkey.pem;

    return 301 https://iotmangrove.info$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name iotmangrove.info;

    ssl_certificate     /etc/letsencrypt/live/iotmangrove.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iotmangrove.info/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API auxiliar (Express): /aux/categorias -> /categorias
    location /aux/ {
        proxy_pass http://api_aux:3000/;
    }

    # API principal (FastAPI), documentacion Swagger y front-end
    location / {
        proxy_pass http://api:5000;
    }
}
