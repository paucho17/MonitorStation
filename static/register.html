<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - IoT Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-container">
    <h3>Crear Nueva Cuenta</h3>

    <div id="error-box" class="alert alert-danger"></div>
    <div id="success-box" class="alert alert-success"></div>

    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" id="username" class="form-control" required autofocus 
                   placeholder="Mínimo 3 caracteres">
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" required
                   placeholder="Mínimo 6 caracteres">
        </div>

        <div class="mb-3">
            <label class="form-label">Confirmar Contraseña</label>
            <input type="password" id="confirmPassword" class="form-control" required
                   placeholder="Repite tu contraseña">
        </div>

        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
    </form>

    <div style="text-align: center; margin-top: 15px;">
        <a href="login.html" style="color: #2b7cff; text-decoration: none;">
            ¿Ya tienes cuenta? Inicia sesión
        </a>
    </div>
</div>

<script src="register.js"></script>

</body>
</html>
