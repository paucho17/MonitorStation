<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IoT Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-container">
    <h3>IoT Dashboard Login</h3>

    <div id="error-box" class="alert alert-danger"></div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" id="username" class="form-control" required autofocus>
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>

    <div style="text-align: center; margin-top: 15px;">
        <a href="register.html" style="color: #2b7cff; text-decoration: none;">
            ¿No tienes cuenta? Regístrate aquí
        </a>
    </div>
</div>

<script src="login.js"></script>

</body>
</html>
